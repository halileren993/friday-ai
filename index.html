<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050b14">
  <title>F.R.I.D.A.Y.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at center, #0a192f 0%, #030710 100%);
      color: #00f3ff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 3px;
      font-weight: 700;
      font-size: 1.1rem;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
    }
    .icon-btn {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #00f3ff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
    }
    .core-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .reactor {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 3px solid #00f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.35), inset 0 0 30px rgba(0, 243, 255, 0.25);
      transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s;
    }
    .reactor::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 243, 255, 0.7);
      animation: spin 12s linear infinite;
    }
    .reactor-inner {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 45%, rgba(0, 243, 255, 0.1) 100%);
      box-shadow: 0 0 25px #00f3ff;
    }
    .reactor.listening {
      border-color: #ff3b5c;
      box-shadow: 0 0 45px rgba(255, 59, 92, 0.7), inset 0 0 30px rgba(255, 59, 92, 0.4);
      animation: pulse 1s infinite;
    }
    .reactor.listening .reactor-inner {
      background: radial-gradient(circle, #ffffff 0%, #ff3b5c 50%, rgba(255, 59, 92, 0.1) 100%);
      box-shadow: 0 0 30px #ff3b5c;
    }
    .reactor.speaking {
      animation: pulse 0.6s infinite;
      box-shadow: 0 0 55px rgba(0, 243, 255, 0.9);
    }
    .status {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8be9fd;
    }
    .log-box {
      width: 100%;
      max-width: 500px;
      min-height: 95px;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(0, 20, 40, 0.65);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 14px;
      padding: 14px;
      font-size: 0.95rem;
      line-height: 1.45;
      color: #e0faff;
      text-align: center;
    }
    .text-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 8px;
    }
    .text-bar input {
      flex: 1;
      background: rgba(0, 20, 40, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.35);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 15, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #081526;
      border: 1px solid #00f3ff;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-card input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      background: #030a14;
      color: #fff;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
<body>
  <header>
    <span>F.R.I.D.A.Y.</span>
    <button class="icon-btn" id="settingsBtn">⚙️</button>
  </header>

  <div class="core-area">
    <div class="reactor" id="reactor">
      <div class="reactor-inner"></div>
    </div>
    <div class="status" id="status">KONUŞMAK İÇİN DOKUN</div>
  </div>

  <div class="log-box" id="logBox">Sistemler çevrimiçi, Efendim. Size nasıl yardımcı olabilirim?</div>

  <form class="text-bar" id="textForm">
    <input type="text" id="textInput" placeholder="Veya buraya yaz..." autocomplete="off">
    <button type="submit" class="icon-btn">Gönder</button>
  </form>

  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <h3>Gemini API Anahtarı</h3>
      <p style="font-size:0.85rem; color:#8be9fd;">Anahtar sadece bu telefonda saklanır.</p>
      <input type="password" id="apiKeyInput" placeholder="AIza...">
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="icon-btn" id="closeModal">Kapat</button>
        <button class="icon-btn" id="saveKey">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const reactor = document.getElementById('reactor');
    const statusEl = document.getElementById('status');
    const logBox = document.getElementById('logBox');
    const modal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const textForm = document.getElementById('textForm');
    const textInput = document.getElementById('textInput');

    let chatHistory = [];
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'tr-TR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        reactor.classList.add('listening');
        statusEl.textContent = 'DİNLİYORUM...';
      };

      recognition.onend = () => {
        isListening = false;
        reactor.classList.remove('listening');
        if (statusEl.textContent === 'DİNLİYORUM...') {
          statusEl.textContent = 'KONUŞMAK İÇİN DOKUN';
        }
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        askFriday(text);
      };

      recognition.onerror = (event) => {
        statusEl.textContent = 'MİKROFON HATASI: ' + event.error;
      };
    }

    function openSettings() {
      apiKeyInput.value = localStorage.getItem('friday_api_key') || '';
      modal.classList.add('open');
    }

    document.getElementById('settingsBtn').onclick = openSettings;
    document.getElementById('closeModal').onclick = () => modal.classList.remove('open');
    document.getElementById('saveKey').onclick = () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        localStorage.setItem('friday_api_key', val);
        modal.classList.remove('open');
        logBox.textContent = 'API anahtarı kaydedildi. Sistem hazır, Efendim.';
      }
    };

    reactor.onclick = () => {
      if (!localStorage.getItem('friday_api_key')) {
        openSettings();
        return;
      }
      window.speechSynthesis.cancel();
      reactor.classList.remove('speaking');

      if (!recognition) {
        logBox.textContent = 'Bu tarayıcı ses tanımayı desteklemiyor. Alttaki yazı kutusunu kullanabilirsin.';
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    };

    textForm.onsubmit = (e) => {
      e.preventDefault();
      const val = textInput.value.trim();
      if (!val) return;
      textInput.value = '';
      askFriday(val);
    };

    async function askFriday(userText) {
      const apiKey = localStorage.getItem('friday_api_key');
      if (!apiKey) {
        openSettings();
        return;
      }

      logBox.textContent = 'Sen: ' + userText;
      statusEl.textContent = 'DÜŞÜNÜYORUM...';

      chatHistory.push({ role: 'user', parts: [{ text: userText }] });
      if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

      try {
        const response = await fetch(
          'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey),
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system_instruction: {
                parts: [{
                  text: "Sen Iron Man filmindeki yapay zeka asistanı F.R.I.D.A.Y.'sin. Kullanıcıya 'Efendim' diye hitap et. Zeki, hızlı, hafif esprili ve net ol. Cevapların sesli okunacağı için kısa tut (en fazla 2-3 cümle) ve kesinlikle yıldız, madde işareti veya emoji kullanma."
                }]
              },
              contents: chatHistory
            })
          }
        );

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error ? data.error.message : 'API bağlantı hatası');
        }

        const reply = data.candidates[0].content.parts[0].text.trim();
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        logBox.textContent = reply;
        speak(reply);
      } catch (err) {
        chatHistory.pop();
        statusEl.textContent = 'BAĞLANTI HATASI';
        logBox.textContent = 'Hata: ' + err.message;
      }
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'tr-TR';
      utter.rate = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const trVoice = voices.find(v => v.lang.startsWith('tr'));
      if (trVoice) utter.voice = trVoice;

      utter.onstart = () => {
        reactor.classList.add('speaking');
        statusEl.textContent = 'F.R.I.D.A.Y. KONUŞUYOR';
      };
      utter.onend = () => {
        reactor.classList.remove('speaking');
        statusEl.textContent = 'KONUŞMAK İÇİN DOKUN';
      };
      window.speechSynthesis.speak(utter);
    }

    if (!localStorage.getItem('friday_api_key')) {
      setTimeout(openSettings, 600);
    }
  </script>
</body>
</html>
